[project]
name = "intelliflow-backend"
version = "0.1.0"
description = "IntelliFlow backend – FastAPI + LangChain + Celery"
requires-python = ">=3.10"
dependencies = [
    "fastapi[all]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.4",
    "celery[redis]>=5.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.7",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "loguru>=0.7.2",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4.8", "black>=24.4.2", "mypy>=1.10.0", "pytest>=8.2.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

