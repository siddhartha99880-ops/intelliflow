# IntelliFlow Celery worker (second Railway service, same repo)
# Create a NEW service → same GitHub repo → Root Directory = backend
# Override start command in Railway UI to:
#   celery -A app.workers.celery_app:celery worker --loglevel=INFO --concurrency=1

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "celery -A app.workers.celery_app:celery worker --loglevel=INFO --concurrency=1"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
