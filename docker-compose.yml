services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intelliflow
    ports:
      - "5432:5432"
    volumes:
      - intelliflow_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/intelliflow"
      REDIS_URL: "redis://redis:6379/0"
      SEED_DEMO_DATA: "1"
      OPENAI_API_KEY: ""
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  celery-worker:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/intelliflow"
      REDIS_URL: "redis://redis:6379/0"
      OPENAI_API_KEY: ""
    depends_on:
      - db
      - redis
    command: ["celery", "-A", "app.workers.celery_app:celery", "worker", "--loglevel=INFO", "--concurrency=1"]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:8000"
    ports:
      - "3000:3000"

volumes:
  intelliflow_postgres_data:

